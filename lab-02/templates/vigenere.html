<!DOCTYPE html>
<html lang="en">
<head>
    <title>Vigenère Cipher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container">
    <h2 class="text-center mt-3 font-weight-bold">VIGENÈRE CIPHER</h2>

    <h4 class="text-primary">ENCRYPTION</h4>
    <form method="POST" action="/vigenere/encrypt">
        <div class="mb-3">
            <label class="form-label">Plain text:</label>
            <input type="text" class="form-control" name="inputPlainText" required autofocus>
        </div>
        <div class="mb-3">
            <label class="form-label">Key:</label>
            <input type="text" class="form-control" name="inputKeyPlain" required>
        </div>
        <button type="submit" class="btn btn-primary">Encrypt</button>
    </form>

    <hr>

    <h4 class="text-primary">DECRYPTION</h4>
    <form method="POST" action="/vigenere/decrypt">
        <div class="mb-3">
            <label class="form-label">Cipher text:</label>
            <input type="text" class="form-control" name="inputCipherText" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Key:</label>
            <input type="text" class="form-control" name="inputKeyCipher" required>
        </div>
        <button type="submit" class="btn btn-success">Decrypt</button>
    </form>
</div>
</body>
</html>
